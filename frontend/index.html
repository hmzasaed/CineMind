    <title>CineMind</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 48rem; padding: 0 1rem; color: #1a1a1a; }
      .prov { color: #555; font-size: 0.75rem; }

      form label { display: block; margin-bottom: 0.75rem; }
